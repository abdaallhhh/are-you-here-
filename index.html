<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S Y S T E M _ O S I N T</title>
    <style>
        :root { --neon: #00ff41; --dim: #003b00; --bg: #0a0a0a; }
        body { background-color: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* تأثير التشويش الغامض */
        .glitch { position: relative; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px; }
        
        #console { flex-grow: 1; background: rgba(0,0,0,0.9); border: 1px solid var(--dim); padding: 15px; overflow-y: auto; box-shadow: inset 0 0 10px #000; position: relative; }
        #console::after { content: ""; position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none; }

        .input-box { display: flex; gap: 10px; margin-top: 20px; background: #000; padding: 10px; border: 1px solid var(--dim); }
        input { background: transparent; border: none; color: var(--neon); flex-grow: 1; outline: none; font-size: 16px; font-family: inherit; }
        button { background: var(--neon); color: #000; border: none; padding: 0 20px; cursor: pointer; font-weight: bold; text-transform: uppercase; }

        .data-row { margin-bottom: 8px; border-right: 3px solid transparent; transition: 0.3s; padding-right: 5px; }
        .data-row:hover { border-right-color: var(--neon); background: rgba(0, 255, 65, 0.05); }
        .label { color: #888; font-size: 0.8rem; }
        .value { color: #fff; text-shadow: 0 0 5px var(--neon); }
        .loading { animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="glitch">S Y S T E M _ O S I N T _ V 1 . 0</div>

    <div id="console">
        <div class="data-row">> بانتظار إدخال الهدف (Target)...</div>
    </div>

    <div class="input-box">
        <input type="text" id="target" placeholder="أدخل الدومين (مثال: google.com)" onkeypress="if(event.key === 'Enter') startInvestigation()">
        <button onclick="startInvestigation()">تحليل</button>
    </div>

    <script>
        async function startInvestigation() {
            const target = document.getElementById('target').value;
            const consoleBox = document.getElementById('console');
            if(!target) return;

            consoleBox.innerHTML = `<div class="data-row loading">> جاري اختراق طبقات البيانات لـ ${target}...</div>`;

            try {
                // محاكاة تأخير للغموض
                await new Promise(r => setTimeout(r, 1500));

                // جلب بيانات حقيقية عن الدومين (عبر DNS lookup بسيط)
                const response = await fetch(`https://rdap.org/domain/${target}`);
                const data = await response.json();

                // تنظيف الكونسول وبدء الطباعة الحقيقية
                consoleBox.innerHTML = `<div class="data-row">> تم فك التشفير بنجاح. بيانات الهدف مستخرجة:</div><br>`;

                const info = [
                    { l: "المنظمة المسجلة", v: data.entities[0].vcardArray[1][1][3] || "غير معلن" },
                    { l: "حالة الدومين", v: data.status[0] },
                    { l: "خوادم الأسماء", v: data.nameservers[0].ldhName },
                    { l: "تاريخ الإنشاء", v: data.events.find(e => e.eventAction === 'registration').eventDate },
                    { l: "بروتوكول التحقق", v: "RDAP/WHOIS SECURED" }
                ];

                info.forEach((item, i) => {
                    setTimeout(() => {
                        const row = document.createElement('div');
                        row.className = 'data-row';
                        row.innerHTML = `<span class="label">${item.l}:</span> <span class="value">${item.v}</span>`;
                        consoleBox.appendChild(row);
                        consoleBox.scrollTop = consoleBox.scrollHeight;
                    }, i * 600);
                });

            } catch (error) {
                consoleBox.innerHTML += `<div class="data-row" style="color:red">> خطأ: فشل الوصول إلى قاعدة بيانات الهدف. تأكد من صحة الدومين.</div>`;
            }
        }
    </script>
</body>
</html>
