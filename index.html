<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal | System-Check</title>
    <style>
        body { background-color: #050505; color: #00ff41; font-family: 'Courier New', Courier, monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #header { padding: 10px; border-bottom: 1px solid #00ff41; background: #000; text-align: center; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        #terminal { flex-grow: 1; padding: 20px; overflow-y: auto; font-size: 14px; line-height: 1.5; }
        .input-area { background: #111; padding: 20px; border-top: 1px solid #00ff41; }
        input { background: transparent; border: 1px solid #00ff41; color: #00ff41; padding: 10px; width: 70%; outline: none; }
        button { background: #00ff41; color: black; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .scan-line { color: #00ff41; margin-bottom: 5px; }
        .warning { color: #ff0000; font-weight: bold; }
        .success { color: #008cff; }
        /* أنيميشن الوميض */
        .cursor { display: inline-block; width: 10px; height: 18px; background: #00ff41; animation: blink 0.8s infinite; vertical-align: middle; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="header">CENTRAL INTELLIGENCE UNIT - VULNERABILITY SCANNER v2.0</div>

<div id="terminal">
    <div class="scan-line">>> System initialization... [OK]</div>
    <div class="scan-line">>> Connecting to secure server... [ENCRYPTED]</div>
    <div class="scan-line">>> Waiting for user target input...<span class="cursor"></span></div>
</div>

<div class="input-area">
    <input type="text" id="targetInput" placeholder="ادخل رابط الموقع أو الـ IP للفحص...">
    <button onclick="startFakeScan()">فحص أمني</button>
</div>

<script>
    const terminal = document.getElementById('terminal');

    function addLog(text, type = '') {
        const div = document.createElement('div');
        div.className = 'scan-line ' + type;
        div.innerHTML = `>> ${text}`;
        terminal.appendChild(div);
        terminal.scrollTop = terminal.scrollHeight;
    }

    function startFakeScan() {
        const target = document.getElementById('targetInput').value;
        if (!target) return alert("الرجاء إدخال هدف أولاً!");

        addLog(`إطلاق عملية الفحص على: ${target}...`, 'success');
        
        let steps = [
            "جاري سحب بيانات الـ DNS...",
            "تحليل المنافذ المفتوحة (Port Scanning)...",
            "فحص ثغرات SQL Injection المحتملة...",
            "تحذير: تم اكتشاف جدار حماية قوي!",
            "محاولة تجاوز الـ Firewall...",
            "نجاح الاتصال الخلفي (Reverse Shell Initialized)...",
            "جاري تحميل تقرير الثغرات النهائي..."
        ];

        steps.forEach((step, index) => {
            setTimeout(() => {
                let type = step.includes('تحذير') ? 'warning' : '';
                addLog(step, type);
                
                if (index === steps.length - 1) {
                    setTimeout(() => {
                        addLog("اكتمل الفحص! تم العثور على (3) ثغرات متوسطة الخطورة.", "success");
                    }, 1000);
                }
            }, (index + 1) * 1500);
        });
    }
</script>

</body>
</html>
